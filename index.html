<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NATUAR Rewards</title>

<style>
:root{
  --bg:#f4efe7;
  --card:#ffffff;
  --ink:#171717;
  --soft:#ece5da;
  --blue:#2f80ed;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:540px;
  margin:auto;
  padding:28px 18px 50px;
}

.brand{
  font-family:Georgia,serif;
  font-size:32px;
  letter-spacing:6px;
  margin:8px 0 28px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}

h1,h2{
  font-family:Georgia,serif;
  margin:0 0 16px;
}

h1{
  font-size:38px;
  line-height:1.05;
}

h2{
  font-size:28px;
}

.kicker{
  font-size:14px;
  opacity:.55;
  margin-bottom:18px;
}

.hidden{
  display:none!important;
}

.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:12px;
  font-size:17px;
  font-weight:700;
}

.primary{
  background:#171717;
  color:#fff;
}

.secondary{
  background:var(--soft);
  color:var(--blue);
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  margin:6px 0 10px;
  background:#fff;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.link{
  border:0;
  background:transparent;
  color:var(--blue);
  font-size:16px;
  font-weight:700;
  text-align:left;
  padding:0;
}

.cups{
  display:flex;
  gap:7px;
  margin:16px 0;
}

.cup{
  flex:1;
  aspect-ratio:1;
  border-radius:14px;
  background:#e9e1d6;
  display:grid;
  place-items:center;
  font-size:20px;
}

.cup.on{
  background:#171717;
  color:#fff;
}

.stats{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin:12px 0;
}

.qr{
  display:grid;
  place-items:center;
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-top:16px;
}

.qr img{
  width:220px;
  height:220px;
  max-width:100%;
}

.small{
  font-size:12px;
  opacity:.62;
  text-align:center;
}

.notice{
  position:fixed;
  left:16px;
  right:16px;
  bottom:24px;
  max-width:500px;
  margin:auto;
  background:#171717;
  color:#fff;
  padding:14px 16px;
  border-radius:14px;
  text-align:center;
  z-index:20;
}

.reward{
  background:#e4efdf;
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  font-weight:700;
}

.back{
  border:0;
  background:transparent;
  padding:0;
  margin-bottom:14px;
  color:var(--blue);
  font-weight:700;
  font-size:16px;
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">NATUAR</div>

  <div id="notice" class="notice hidden"></div>

  <section id="home" class="card">
    <div class="kicker">REWARDS</div>
    <h1>5 καφέδες.<br>Ο επόμενος δώρο.</h1>

    <button class="btn primary" onclick="showCreate()">
      + Νέος πελάτης
    </button>

    <button class="btn secondary" onclick="showCustomers()">
      👥 Πελάτες
    </button>
  </section>

  <section id="create" class="card hidden">
    <button class="back" onclick="home()">← Πίσω</button>

    <h2>Νέος πελάτης</h2>

    <input id="name" placeholder="Όνομα">
    <input id="phone" placeholder="Τηλέφωνο" inputmode="tel">
    <input id="email" placeholder="Email">

    <button class="btn primary" onclick="createCustomer()">
      Δημιουργία κάρτας
    </button>
  </section>

  <section id="customers" class="card hidden">
    <button class="back" onclick="home()">← Πίσω</button>

    <h2>Πελάτες</h2>

    <div id="list"></div>
  </section>

  <section id="detail" class="card hidden">
    <button class="back" onclick="showCustomers()">← Πελάτες</button>

    <div class="kicker">NATUAR REWARDS</div>

    <h2 id="dname">Πελάτης</h2>

    <div id="dphone" class="kicker"></div>

    <div id="cups" class="cups"></div>

    <div class="stats">
      <span>Πρόοδος</span>
      <strong id="progress">0/5</strong>

      <span>Δώρα</span>
      <strong id="rewards">0</strong>

      <span>Σύνολο καφέδων</span>
      <strong id="totalCoffees">0</strong>
    </div>

    <div id="rewardBox" class="reward hidden">
      🎁 Δωρεάν καφές διαθέσιμος!
    </div>

    <button class="btn primary" onclick="addCoffee()">
      ☕ +1 Καφές
    </button>

    <button id="redeemBtn" class="btn secondary hidden" onclick="redeem()">
      🎁 Εξαργύρωση
    </button>

    <div class="qr">
      <img id="qrimg" width="220" height="220" alt="QR πελάτη">
    </div>

    <p class="small">Μοναδικό QR πελάτη</p>
  </section>

</div>

<script>

const SUPABASE_URL =
'https://kpakafhjekumuosbiaoq.supabase.co';

const SUPABASE_KEY =
'sb_publishable_Tu4wJxyDSlrCer81Urk1Xw_i5j9bw-P';

const SITE_URL =
'https://nhousos-ship-it.github.io/natuar-rewards-v4/';

let currentCustomer = null;


/* -----------------------------
   UI
----------------------------- */

function only(id){

  ['home','create','customers','detail']
  .forEach(x=>{
    document
    .getElementById(x)
    .classList
    .add('hidden');
  });

  document
  .getElementById(id)
  .classList
  .remove('hidden');
}


function home(){

  currentCustomer = null;

  only('home');
}


function showCreate(){

  only('create');
}


function toast(text){

  const n =
  document.getElementById('notice');

  n.textContent = text;

  n.classList.remove('hidden');

  clearTimeout(toast.timer);

  toast.timer =
  setTimeout(()=>{
    n.classList.add('hidden');
  },2200);
}


/* -----------------------------
   UUID
----------------------------- */

function makeUUID(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();
  }

  return (
    'c-' +
    Date.now() +
    '-' +
    Math.random()
    .toString(36)
    .slice(2)
  );
}


/* -----------------------------
   Supabase helpers
----------------------------- */

function apiHeaders(extra={}){

  return {

    'apikey':
    SUPABASE_KEY,

    'Authorization':
    'Bearer ' + SUPABASE_KEY,

    ...extra
  };
}


function fromDatabase(row){

  return {

    db_id:
    row.id || null,

    id:
    row.loyalty_code,

    name:
    row.name || 'Πελάτης',

    phone:
    row.phone || '',

    email:
    row.email || '',

    coffees:
    Number(row.stamps) || 0,

    rewards:
    Number(row.rewards_available) || 0,

    total:
    Number(row.lifetime_coffees) || 0,

    lifetime_rewards:
    Number(row.lifetime_rewards) || 0
  };
}


/* -----------------------------
   Save customer
----------------------------- */

async function saveCustomer(customer){

  const payload = {

    loyalty_code:
    customer.id,

    name:
    customer.name,

    phone:
    customer.phone || null,

    email:
    customer.email || null,

    stamps:
    Number(customer.coffees) || 0,

    rewards_available:
    Number(customer.rewards) || 0,

    lifetime_coffees:
    Number(customer.total) || 0,

    lifetime_rewards:
    Number(customer.lifetime_rewards) || 0,

    active:
    true
  };


  const response =
  await fetch(

    SUPABASE_URL +
    '/rest/v1/customers' +
    '?on_conflict=loyalty_code',

    {

      method:'POST',

      headers:
      apiHeaders({

        'Content-Type':
        'application/json',

        'Prefer':
        'resolution=merge-duplicates,return=representation'
      }),

      body:
      JSON.stringify(payload)
    }
  );


  if(!response.ok){

    const message =
    await response.text();

    console.error(message);

    throw new Error(
      'Δεν έγινε αποθήκευση'
    );
  }


  return true;
}


/* -----------------------------
   Load single customer
----------------------------- */

async function loadCustomer(code){

  const response =
  await fetch(

    SUPABASE_URL +

    '/rest/v1/customers' +

    '?loyalty_code=eq.' +

    encodeURIComponent(code) +

    '&select=*',

    {
      headers:
      apiHeaders()
    }
  );


  if(!response.ok){

    const message =
    await response.text();

    console.error(message);

    throw new Error(
      'Σφάλμα φόρτωσης πελάτη'
    );
  }


  const rows =
  await response.json();


  if(
    !rows ||
    !rows.length
  ){

    return null;
  }


  return fromDatabase(
    rows[0]
  );
}


/* -----------------------------
   Load all customers
----------------------------- */

async function loadCustomers(){

  const response =
  await fetch(

    SUPABASE_URL +

    '/rest/v1/customers' +

    '?active=eq.true' +

    '&select=*' +

    '&order=created_at.desc',

    {
      headers:
      apiHeaders()
    }
  );


  if(!response.ok){

    const message =
    await response.text();

    console.error(message);

    throw new Error(
      'Σφάλμα λίστας πελατών'
    );
  }


  const rows =
  await response.json();


  return rows.map(
    fromDatabase
  );
}


/* -----------------------------
   Create customer
----------------------------- */

async function createCustomer(){

  const name =
  document
  .getElementById('name')
  .value
  .trim();


  const phone =
  document
  .getElementById('phone')
  .value
  .trim();


  const email =
  document
  .getElementById('email')
  .value
  .trim();


  if(!name){

    toast('Γράψε όνομα');

    return;
  }


  const customer = {

    id:
    makeUUID(),

    name,

    phone,

    email,

    coffees:0,

    rewards:0,

    total:0,

    lifetime_rewards:0
  };


  try{

    await saveCustomer(
      customer
    );


    document
    .getElementById('name')
    .value='';


    document
    .getElementById('phone')
    .value='';


    document
    .getElementById('email')
    .value='';


    currentCustomer =
    customer;


    renderDetail();


    toast(
      '✅ Δημιουργήθηκε πελάτης'
    );

  }

  catch(error){

    console.error(error);

    alert(
      'Δεν αποθηκεύτηκε ο πελάτης.'
    );
  }
}


/* -----------------------------
   Customer list
----------------------------- */

async function showCustomers(){

  only('customers');


  const list =
  document
  .getElementById('list');


  list.innerHTML =
  '<p class="small">Φόρτωση…</p>';


  try{

    const customers =
    await loadCustomers();


    list.innerHTML='';


    if(!customers.length){

      list.innerHTML =
      '<p class="small">Δεν υπάρχουν πελάτες ακόμη.</p>';

      return;
    }


    customers
    .forEach(customer=>{

      const row =
      document
      .createElement('div');


      row.className =
      'row';


      const button =
      document
      .createElement('button');


      button.className =
      'link';


      button.textContent =
      customer.name +
      (
        customer.phone
        ?
        ' · ' + customer.phone
        :
        ''
      );


      button.onclick =
      ()=>openCustomer(
        customer.id
      );


      const progress =
      document
      .createElement('span');


      progress.textContent =
      customer.coffees +
      '/5';


      row.appendChild(
        button
      );


      row.appendChild(
        progress
      );


      list.appendChild(
        row
      );
    });

  }

  catch(error){

    console.error(error);

    list.innerHTML =
    '<p class="small">Σφάλμα φόρτωσης.</p>';
  }
}


/* -----------------------------
   Open customer
----------------------------- */

async function openCustomer(code){

  try{

    const customer =
    await loadCustomer(code);


    if(!customer){

      alert(
        'Ο πελάτης δεν βρέθηκε.'
      );

      home();

      return;
    }


    currentCustomer =
    customer;


    renderDetail();

  }

  catch(error){

    console.error(error);

    alert(
      'Σφάλμα σύνδεσης.'
    );
  }
}


/* -----------------------------
   Render loyalty card
----------------------------- */

function renderDetail(){

  const customer =
  currentCustomer;


  if(!customer){

    home();

    return;
  }


  document
  .getElementById('dname')
  .textContent =
  customer.name;


  document
  .getElementById('dphone')
  .textContent =

  [
    customer.phone,
    customer.email
  ]
  .filter(Boolean)
  .join(' · ');


  document
  .getElementById('progress')
  .textContent =

  customer.coffees +
  '/5';


  document
  .getElementById('rewards')
  .textContent =

  customer.rewards;


  document
  .getElementById('totalCoffees')
  .textContent =

  customer.total;


  const cups =
  document
  .getElementById('cups');


  cups.innerHTML='';


  for(
    let i=0;
    i<5;
    i++
  ){

    const cup =
    document
    .createElement('div');


    cup.className =

    'cup' +

    (
      i < customer.coffees
      ?
      ' on'
      :
      ''
    );


    cup.textContent =
    i < customer.coffees
    ?
    '☕'
    :
    '';


    cups.appendChild(
      cup
    );
  }


  const hasReward =
  customer.rewards > 0;


  document
  .getElementById('rewardBox')
  .classList
  .toggle(
    'hidden',
    !hasReward
  );


  document
  .getElementById('redeemBtn')
  .classList
  .toggle(
    'hidden',
    !hasReward
  );


  const customerURL =

  SITE_URL +

  '?customer=' +

  encodeURIComponent(
    customer.id
  );


  document
  .getElementById('qrimg')
  .src =

  'https://api.qrserver.com/v1/create-qr-code/' +

  '?size=300x300&data=' +

  encodeURIComponent(
    customerURL
  );


  only('detail');
}


/* -----------------------------
   Add coffee
----------------------------- */

async function addCoffee(){

  if(!currentCustomer){

    return;
  }


  const next = {

    ...currentCustomer
  };


  next.coffees += 1;

  next.total += 1;


  let rewardEarned =
  false;


  if(
    next.coffees >= 5
  ){

    next.coffees = 0;

    next.rewards += 1;

    next.lifetime_rewards += 1;

    rewardEarned =
    true;
  }


  try{

    await saveCustomer(
      next
    );


    currentCustomer =
    next;


    renderDetail();


    if(rewardEarned){

      toast(
        '🎁 Κερδήθηκε δωρεάν καφές!'
      );

    }else{

      toast(
        '☕ Προστέθηκε καφές'
      );
    }

  }

  catch(error){

    console.error(error);

    alert(
      'Δεν αποθηκεύτηκε ο καφές.'
    );
  }
}


/* -----------------------------
   Redeem reward
----------------------------- */

async function redeem(){

  if(
    !currentCustomer ||
    currentCustomer.rewards < 1
  ){

    toast(
      'Δεν υπάρχει διαθέσιμο δώρο'
    );

    return;
  }


  const next = {

    ...currentCustomer,

    rewards:
    currentCustomer.rewards - 1
  };


  try{

    await saveCustomer(
      next
    );


    currentCustomer =
    next;


    renderDetail();


    toast(
      '✅ Το δώρο εξαργυρώθηκε'
    );

  }

  catch(error){

    console.error(error);

    alert(
      'Δεν αποθηκεύτηκε η εξαργύρωση.'
    );
  }
}


/* -----------------------------
   App start
----------------------------- */

async function startApp(){

  const params =
  new URLSearchParams(
    window.location.search
  );


  const customerCode =
  params.get('customer');


  if(customerCode){

    await openCustomer(
      customerCode
    );

    return;
  }


  home();
}


startApp();

</script>

</body>
</html>
